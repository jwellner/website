<!doctype html>
<!-- Source for public/assets/og-image.png (1200x630 link preview). Regenerate with scripts/og-image.sh -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; }
  body {
    width: 1200px;
    height: 630px;
    box-sizing: border-box;
    padding: 56px 72px;
    background: #1b1b1b;
    color: #33ff33;
    font-family: "DejaVu Sans Mono", ui-monospace, monospace;
    font-size: 30px;
    line-height: 1.45;
    display: flex;
    flex-direction: column;
  }
  .bar { display: flex; gap: 14px; margin-bottom: 44px; }
  .bar span { width: 18px; height: 18px; border-radius: 50%; background: #333; }
  .prompt { color: #5fa8ff; }
  .dim { opacity: 0.6; }
  h1 { margin: 6px 0 0; font-size: 76px; line-height: 1.1; color: #fff; font-weight: bold; }
  .tagline { margin: 10px 0 34px; font-size: 40px; }
  dl { display: grid; grid-template-columns: max-content 1fr; gap: 2px 28px; margin: 6px 0 0; font-size: 28px; }
  dt { font-weight: bold; }
  dd { margin: 0; color: #ddd; }
  .foot { margin-top: auto; display: flex; justify-content: space-between; font-size: 28px; }
  .cursor { display: inline-block; width: 0.6em; height: 1.1em; background: #33ff33; vertical-align: text-bottom; }
</style>
</head>
<body>
  <div class="bar"><span></span><span></span><span></span></div>
  <div><span class="prompt">guest@wllnr.nl:~$</span> whoami</div>
  <h1>Jeroen Wellner</h1>
  <div class="tagline">Software/DevOps &amp; AI Engineer</div>
  <div><span class="prompt">guest@wllnr.nl:~$</span> cat skills</div>
  <dl>
    <dt>ai</dt><dd>LLM features in production · self-hosted models</dd>
    <dt>agents</dt><dd>a team of AI coding agents, reviewed by me</dd>
    <dt>run</dt><dd>Kubernetes · Flux GitOps · Grafana</dd>
  </dl>
  <div class="foot">
    <span><span class="prompt">guest@wllnr.nl:~$</span> <span class="cursor"></span></span>
    <span class="dim">www.wllnr.nl</span>
  </div>
</body>
</html>
